<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS Crypt Cipher - Secure Storage Node</title>
    <style>
        :root {
            --bg-color: #0a0f1d;
            --container-bg: #111827;
            --accent-blue: #0ea5e9;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border-color: #1f2937;
            --input-bg: #1f2937;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        header h1 {
            color: var(--accent-blue);
            margin: 0;
            font-size: 28px;
            letter-spacing: 1px;
        }
        header p {
            color: var(--text-muted);
            margin: 5px 0 0 0;
            font-size: 14px;
        }
        .main-wrapper {
            width: 100%;
            max-width: 650px;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }
        .section-card {
            background-color: var(--container-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }
        .section-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-main);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }
        .section-title span {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            text-transform: uppercase;
            background-color: rgba(14, 165, 233, 0.2);
            color: var(--accent-blue);
        }
        .input-group {
            margin-bottom: 15px;
        }
        .input-group label {
            display: block;
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 6px;
        }
        input[type="password"], textarea {
            width: 100%;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 12px;
            color: var(--text-main);
            font-size: 14px;
            box-sizing: border-box;
            font-family: inherit;
        }
        textarea {
            resize: vertical;
            min-height: 120px;
        }
        input:focus, textarea:focus {
            outline: 1px solid var(--accent-blue);
            border-color: var(--accent-blue);
        }
        .btn-container {
            display: flex;
            gap: 12px;
            margin-top: 10px;
        }
        .action-btn {
            flex: 1;
            color: white;
            border: none;
            padding: 12px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: opacity 0.2s ease;
        }
        .action-btn:hover { opacity: 0.9; }
        .btn-encrypt { background-color: var(--accent-blue); }
        .btn-decrypt { background-color: var(--accent-green); }
        
        .status-panel {
            background-color: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 12px;
            margin-top: 15px;
            font-family: monospace;
            font-size: 12px;
            color: var(--accent-green);
            white-space: pre-wrap;
            word-break: break-all;
            display: none;
        }
        .status-error { color: var(--accent-red); border-color: var(--accent-red); }
        
        .gateway-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: rgba(14,165,233,0.02);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
        }
        .gateway-title {
            font-size: 13px;
            color: var(--text-muted);
            margin: 0;
            font-weight: 600;
        }
        .gateway-link {
            color: var(--accent-blue);
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            transition: color 0.2s ease;
        }
        .gateway-link:hover {
            color: #38bdf8;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <header>
        <h1>JARVIS Crypt Cipher</h1>
        <p>Offline Crypto Engine • Core Local Sandbox Terminal</p>
    </header>

    <div class="main-wrapper">

        <!-- SECURITY PORTAL INTER-LINKING SYSTEM -->
        <div class="gateway-container">
            <h3 class="gateway-title">Looking for alternative operations or specialized formatting systems?</h3>
            <a href="https://muhammadrazaali7210-hash.github.io/AliRazaConverter/" target="_blank" class="gateway-link">
                → Open Document & Configuration Converter Tool
            </a>
            <a href="https://muhammadrazaali7210-hash.github.io/VideotoaudioVideoConverter/" target="_blank" class="gateway-link">
                → Open Video to Audio / High-Resolution Muxing Engine
            </a>
        </div>

        <!-- RE-ENGINEERED TEXT CRYPTO ENGINE -->
        <div class="section-card">
            <div class="section-title">Text Cipher Matrix <span>Secure Base</span></div>
            
            <div class="input-group">
                <label>Target Entry Key / Passphrase:</label>
                <input type="password" id="textPassword" placeholder="Enter custom protective key string...">
            </div>
            
            <div class="input-group">
                <label>Input Text Segment (Raw data string to lock OR scrambled cipher payload to unlock):</label>
                <textarea id="textInput" placeholder="Stage target data matrices here..."></textarea>
            </div>
            
            <div class="btn-container">
                <button class="action-btn btn-encrypt" onclick="executeTextCipher(true)">Encrypt Text Node</button>
                <button class="action-btn btn-decrypt" onclick="executeTextCipher(false)">Decrypt Text Node</button>
            </div>
            
            <div class="status-panel" id="textLog"></div>
        </div>

    </div>

    <script>
        const CRYPTO_ALGO = "AES-GCM";
        const KEY_DERIVATION_ALGO = "PBKDF2";

        function logOutput(logId, msg, isError = false) {
            const panel = document.getElementById(logId);
            panel.style.display = "block";
            panel.innerText = msg;
            if (isError) panel.classList.add("status-error");
            else panel.classList.remove("status-error");
        }

        async function deriveKeyStructure(passwordStr, saltBytes) {
            const enc = new TextEncoder();
            const initialKeyMaterial = await crypto.subtle.importKey(
                "raw", enc.encode(passwordStr), { name: KEY_DERIVATION_ALGO }, false, ["deriveKey"]
            );
            return await crypto.subtle.deriveKey(
                {
                    name: KEY_DERIVATION_ALGO,
                    salt: saltBytes,
                    iterations: 100000,
                    hash: "SHA-256"
                },
                initialKeyMaterial,
                { name: CRYPTO_ALGO, length: 256 },
                false,
                ["encrypt", "decrypt"]
            );
        }

        async function executeTextCipher(isEncrypt) {
            const password = document.getElementById("textPassword").value;
            const inputData = document.getElementById("textInput").value.trim();
            const logId = "textLog";

            if (!password || !inputData) {
                logOutput(logId, "> Exception Error: Both authorization password and text components are required, sir.", true);
                return;
            }

            try {
                if (isEncrypt) {
                    logOutput(logId, "> Compiling data buffers securely...");
                    const salt = crypto.getRandomValues(new Uint8Array(16));
                    const iv = crypto.getRandomValues(new Uint8Array(12));
                    const key = await deriveKeyStructure(password, salt);
                    
                    const encodedText = new TextEncoder().encode(inputData);
                    const encryptedBuffer = await crypto.subtle.encrypt(
                        { name: CRYPTO_ALGO, iv: iv }, key, encodedText
                    );

                    const packingArray = new Uint8Array(salt.length + iv.length + encryptedBuffer.byteLength);
                    packingArray.set(salt, 0);
                    packingArray.set(iv, salt.length);
                    packingArray.set(new Uint8Array(encryptedBuffer), salt.length + iv.length);

                    const base64String = btoa(String.fromCharCode.apply(null, packingArray));
                    logOutput(logId, `> Secure Token Structuring Successful, Sir:\n\n${base64String}`);
                } else {
                    logOutput(logId, "> Processing structural verification...");
                    const binaryData = Uint8Array.from(atob(inputData), c => c.charCodeAt(0));
                    
                    const salt = binaryData.slice(0, 16);
                    const iv = binaryData.slice(16, 28);
                    const ciphertext = binaryData.slice(28);

                    const key = await deriveKeyStructure(password, salt);
                    const decryptedBuffer = await crypto.subtle.decrypt(
                        { name: CRYPTO_ALGO, iv: iv }, key, ciphertext
                    );

                    const plainText = new TextDecoder().decode(decryptedBuffer);
                    logOutput(logId, `> Processing Finalized. Result Data Core, Sir:\n\n${plainText}`);
                }
            } catch (err) {
                console.error(err);
                logOutput(logId, "> Access Denied: Operational mismatch. The password structural variant is invalid, sir.", true);
            }
        }
    </script>
</body>
</html>
